<!doctype html>
<html lang="cs">
<head>
</head>
    <meta charset="utf-8" />
<body>
    <header>
        <h1>Třidní nastěnka</h1>
        <p>Jednoduchá evidence úkolů</p>
    </header>
    <main>
        <section>
            <h2>Přidat úkol</h2>
            <form>
                <div>
                    <label>Předmět</label></br>
                    <select>
                        <option value="" disabled selected>Vyber předmět....</option>
                        <option value="MAT">Matematika</option>
                        <option value="AJ">Angličtina</option>
                        <option value="CJ">Český jazyk</option>
                        <option value="FYZ">Fyzika</option>
                    </select>
                </div>
                <div>
                    <label>Popis úkolů</label></br>
                    <input type="text" required maxlenght="140"
                        placeholder="Napiš popis úkolu">
                </div>
                <div>
                    <label>Termín</label></br>
                    <input type="date" required>
                </div>
            <div>
                <button>Přidat</button>
            </div>
            </form>
            
        </section>
         <section>
             <h2>Seznam úkolů</h2>
             <div id="tasklist">
                 <!-- sem  da javascript seznam ukolu-->
             </div>
            
        </section>
    </main>
</body>
</html>
